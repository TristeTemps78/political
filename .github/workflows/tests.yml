name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests unitaires
        run: node --test tests/*.test.mjs
      - name: Simulation d'équilibrage (rapide)
        run: node tools/simulate.mjs 200
